<!DOCTYPE html>
<html>
<head>
<title>Book Ticket</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h2>🎟 Book Train Ticket</h2>

<form id="reservationForm">

<input type="text" id="name" placeholder="Passenger Name" required>

<input type="text" id="trainNumber" placeholder="Train Number" required>

<input type="text" id="trainName" placeholder="Train Name" required>

<input type="text" id="classType" placeholder="Class Type">

<input type="date" id="journeyDate">

<input type="text" id="fromPlace" placeholder="From City">

<input type="text" id="toPlace" placeholder="Destination City">

<button type="submit">Book Ticket</button>

</form>

<p id="pnrMessage"></p>

<br>

<a href="cancel.html">
<button>Cancel Ticket</button>
</a>

</div>

<script src="script.js"></script>

</body>
</html>
