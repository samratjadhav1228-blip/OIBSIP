<!DOCTYPE html>
<html>
<head>
<title>Train Reservation</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h2>Reservation Form</h2>

<form id="reservationForm">

<input type="text" id="name" placeholder="Passenger Name" required>

<input type="text" id="trainNumber" placeholder="Train Number" required>

<input type="text" id="trainName" placeholder="Train Name" required>

<input type="text" id="classType" placeholder="Class Type">

<input type="date" id="journeyDate">

<input type="text" id="fromPlace" placeholder="From">

<input type="text" id="toPlace" placeholder="To">

<button type="submit">Book Ticket</button>

</form>

<p id="pnrMessage"></p>

<script src="script.js"></script>

</body>
</html>
